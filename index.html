<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management System</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>User Management System</h1>

            <p>Add and Manage Users</p>

            <form method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Enter Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Enter Email"
                    required
                >

                <button type="submit">
                    Add User
                </button>

            </form>

        </div>

        <div class="table-card">

            <h2>Registered Users</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                    </tr>

                </thead>

                <tbody>

                    {% for user in users %}

                    <tr>

                        <td>{{ user['id'] }}</td>

                        <td>{{ user['name'] }}</td>

                        <td>{{ user['email'] }}</td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
